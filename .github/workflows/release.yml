name: Release

# Runs when a version tag is pushed (git tag v1.1.0 && git push origin v1.1.0).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Tag must match package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${v}" >&2
            exit 1
          fi
      - run: npm ci --prefix tests
      - run: npm run test:full
      - name: Prepare files
        run: |
          mkdir -p site
          cp dist/EVSmith.html site/index.html
          # installable app: service worker, manifest and icons sit next to the page (not needed by the downloadable file)
          cp -r dist/sw.js dist/manifest.webmanifest dist/icons site/
          cp dist/EVSmith.html "EVSmith-${GITHUB_REF_NAME}.html"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            EVSmith-${{ github.ref_name }}.html
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "EVSmith-${GITHUB_REF_NAME}.html" \
            --repo "${GITHUB_REPOSITORY}" --title "EVSmith ${GITHUB_REF_NAME}" --generate-notes

  pages:
    # Only when the repository variable PUBLISH_PAGES is 'true' (Settings -> Secrets and variables -> Actions -> Variables)
    if: ${{ vars.PUBLISH_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
