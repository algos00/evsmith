name: Wrong result or bug
description: A damage number, a spread or the page itself does not behave as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: The fastest way to reproduce your case is the share link (🔗 Copy link). Please do not paste personal data.
  - type: input
    id: link
    attributes:
      label: Share link
      description: Press “🔗 Copy link” in EVSmith and paste it here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For damage numbers, say where the expected value comes from (in-game test, Showdown calculator…).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EVSmith version
      description: Shown at the bottom of the page (for example 1.2.0).
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android
